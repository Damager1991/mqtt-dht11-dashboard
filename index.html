<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DHT11 MQTT Dashboard</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0f172a;
      color:white;
      font-family:Arial, sans-serif;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      font-size:2.2rem;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      padding:25px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      text-align:center;
    }

    .icon{
      font-size:3rem;
      margin-bottom:15px;
    }

    .label{
      font-size:1.2rem;
      color:#94a3b8;
    }

    .value{
      font-size:3rem;
      font-weight:bold;
      margin-top:10px;
    }

    .temp{
      color:#f97316;
    }

    .hum{
      color:#38bdf8;
    }

    .status{
      text-align:center;
      margin-top:20px;
      color:#94a3b8;
    }

    canvas{
      background:#1e293b;
      border-radius:20px;
      padding:20px;
    }

  </style>
</head>

<body>

  <h1>🌡️ DHT11 Live Dashboard</h1>

  <div class="grid">

    <div class="card">
      <div class="icon">🌡️</div>
      <div class="label">Temperatur</div>
      <div class="value temp" id="temp">-- °C</div>
    </div>

    <div class="card">
      <div class="icon">💧</div>
      <div class="label">Luftfeuchtigkeit</div>
      <div class="value hum" id="hum">-- %</div>
    </div>

  </div>

  <canvas id="chart"></canvas>

  <div class="status" id="status">
    Verbinde mit MQTT...
  </div>

  <script>

    const broker =
      "wss://broker.emqx.io:8084/mqtt";

    const topicTemp =
      "schule/dht11/temperatur";

    const topicHum =
      "schule/dht11/feuchtigkeit";

    const client = mqtt.connect(broker);

    const tempElement =
      document.getElementById("temp");

    const humElement =
      document.getElementById("hum");

    const statusElement =
      document.getElementById("status");

    const labels = [];

    const tempData = [];

    const humData = [];

    const chart = new Chart(
      document.getElementById("chart"),
      {
        type: "line",

        data: {

          labels: labels,

          datasets: [

            {
              label: "Temperatur °C",
              data: tempData,
              borderColor: "#f97316",
              backgroundColor: "#f97316",
              tension:0.3
            },

            {
              label: "Luftfeuchtigkeit %",
              data: humData,
              borderColor: "#38bdf8",
              backgroundColor: "#38bdf8",
              tension:0.3
            }

          ]
        },

        options: {

          responsive:true,

          plugins:{
            legend:{
              labels:{
                color:"white"
              }
            }
          },

          scales:{

            x:{
              ticks:{
                color:"white"
              }
            },

            y:{
              ticks:{
                color:"white"
              }
            }

          }

        }
      }
    );

    client.on("connect", () => {

      statusElement.innerHTML =
        "🟢 MQTT verbunden";

      client.subscribe(topicTemp);
      client.subscribe(topicHum);
    });

    let currentTemp = null;
    let currentHum = null;

    client.on("message", (topic, message) => {

      const value =
        parseFloat(message.toString());

      if(topic === topicTemp){

        currentTemp = value;

        tempElement.innerHTML =
          value.toFixed(1) + " °C";
      }

      if(topic === topicHum){

        currentHum = value;

        humElement.innerHTML =
          value.toFixed(1) + " %";
      }

      if(currentTemp !== null &&
         currentHum !== null){

        const time =
          new Date().toLocaleTimeString();

        labels.push(time);

        tempData.push(currentTemp);

        humData.push(currentHum);

        if(labels.length > 15){

          labels.shift();

          tempData.shift();

          humData.shift();
        }

        chart.update();
      }

    });

    client.on("reconnect", () => {

      statusElement.innerHTML =
        "🟡 Verbinde erneut...";
    });

    client.on("error", () => {

      statusElement.innerHTML =
        "🔴 MQTT Fehler";
    });

  </script>

</body>
</html>
