<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHT11 Live</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { background: #0f172a; color: white; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 600px; margin: 30px auto; }
    .card { background: #1e293b; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .icon { font-size: 3rem; margin-bottom: 10px; }
    .label { font-size: 1.2rem; color: #94a3b8; }
    .value { font-size: 3rem; font-weight: bold; margin-top: 10px; }
    .temp { color: #f97316; }
    .hum { color: #38bdf8; }
    .status { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h1>🌡️ DHT11 Live</h1>

  <div class="grid">
    <div class="card">
      <div class="icon">🌡️</div>
      <div class="label">Temperatur</div>
      <div class="value temp" id="temp">warten... °C</div>
    </div>

    <div class="card">
      <div class="icon">💧</div>
      <div class="label">Luftfeuchtigkeit</div>
      <div class="value hum" id="hum">warten... %</div>
    </div>
  </div>

  <div class="status" id="status">Verbinde mit MQTT...</div>

  <script>
    const MQTTBroker = "wss://broker.emqx.io:8084/mqtt";
    const datenKanalTemp = "schule/dht11/temperatur";
    const datenKanalHum = "schule/dht11/feuchtigkeit";

    const mqttVerbindung = mqtt.connect(MQTTBroker);
    const anzeigeTemp = document.getElementById("temp");
    const anzeigeHum = document.getElementById("hum");
    const netzwerkStatus = document.getElementById("status");

    mqttVerbindung.on("connect", () => {
      netzwerkStatus.innerHTML = "🟢 MQTT verbunden"; 
      mqttVerbindung.subscribe(datenKanalTemp);
      mqttVerbindung.subscribe(datenKanalHum);
    });

    mqttVerbindung.on("message", (zielKanal, rohDaten) => {
      const messwertFormatiert = parseFloat(rohDaten.toString()).toFixed(1);
      
      if (zielKanal === datenKanalTemp) {
        anzeigeTemp.innerHTML = messwertFormatiert + " °C";
      }
      if (zielKanal === datenKanalHum) {
        anzeigeHum.innerHTML = messwertFormatiert + " %";
      }
    });

    mqttVerbindung.on("reconnect", () => {
      netzwerkStatus.innerHTML = "🟡 Verbinde erneut...";
    });
    
    mqttVerbindung.on("error", () => {
      netzwerkStatus.innerHTML = "🔴 MQTT Fehler";
    });
  </script>

</body>
</html>
