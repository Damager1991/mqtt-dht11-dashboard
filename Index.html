<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>DHT11 MQTT Anzeige</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .card {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }

    h1 {
      margin-bottom: 25px;
    }

    .value {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 15px 0;
    }

    .status {
      margin-top: 25px;
      font-size: 0.9rem;
      color: gray;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>DHT11 Messwerte</h1>

    <p>Temperatur</p>
    <div class="value" id="temp">-- °C</div>

    <p>Luftfeuchtigkeit</p>
    <div class="value" id="hum">-- %</div>

    <div class="status" id="status">Verbinde mit MQTT...</div>
  </div>

  <script>
    const brokerUrl = "wss://broker.emqx.io:8084/mqtt";

    const options = {
      clientId: "webclient_" + Math.random().toString(16).substring(2, 10),
      clean: true,
      connectTimeout: 4000,
      reconnectPeriod: 2000
    };

    const topicTemp = "schule/dht11/temperatur";
    const topicHum  = "schule/dht11/feuchtigkeit";

    const client = mqtt.connect(brokerUrl, options);

    client.on("connect", function () {
      document.getElementById("status").innerText = "MQTT verbunden";

      client.subscribe(topicTemp);
      client.subscribe(topicHum);
    });

    client.on("message", function (topic, message) {
      const value = message.toString();

      if (topic === topicTemp) {
        document.getElementById("temp").innerText = value + " °C";
      }

      if (topic === topicHum) {
        document.getElementById("hum").innerText = value + " %";
      }

      document.getElementById("status").innerText =
        "Letztes Update: " + new Date().toLocaleTimeString();
    });

    client.on("error", function (error) {
      document.getElementById("status").innerText =
        "MQTT Fehler: " + error.message;
    });

    client.on("reconnect", function () {
      document.getElementById("status").innerText =
        "Verbinde erneut...";
    });
  </script>

</body>
</html>
